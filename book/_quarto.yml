# Quarto book built from stylized-facts.qmd: a flat list of chapters, one
# per question. See AGENTS.md ("The book") and tools/book_split.py for the
# claim→question mapping and the chapter format.
project:
  type: book
  output-dir: _book

book:
  title: "Stylized Facts about AI & Human Capabilities"
  author: "Tom Cunningham & Ali Merali"
  date: today
  repo-url: https://github.com/elasticity-ai/stylized-facts
  repo-subdir: book
  repo-actions: [edit, issue]
  sidebar:
    style: floating
    search: true
  chapters:
    - index.qmd
    - measure-of-machine-intelligence.qmd
    - taxonomy-of-ai-capabilities.qmd
    - latent-factor-of-llm-intelligence.qmd
    - llm-vs-human-latent-intelligence.qmd
    - bottleneck-on-llm-abilities.qmd
    - bottleneck-candidates.qmd
    - forecasts-of-future-capabilities.qmd
    - benchmark-saturation.qmd
    - correlation-across-benchmarks.qmd
    - training-compute-and-performance.qmd
    - growth-of-effective-scale.qmd
    - test-time-scaling.qmd
    - human-difficulty-vs-llm-difficulty.qmd
    - context-length.qmd
    - within-task-variability.qmd
    - sub-task-variability.qmd
    - prompt-sensitivity.qmd
    - task-length-and-llm-difficulty.qmd
    - llm-math-ability.qmd
    - llm-programming-ability.qmd
    - exam-questions.qmd
    - autonomous-software-engineering.qmd
    - ai-producing-ai-inputs.qmd
    - algorithmic-improvement.qmd
    - long-form-outputs.qmd
    - economically-valuable-tasks.qmd
    - where-humans-outperform.qmd
    - benchmarks-beyond-human-ability.qmd
    - real-world-actions.qmd
    - llm-ability-to-play-games.qmd
    - hallucination.qmd
    - calibration.qmd
    - logically-complex-and-ux-tasks.qmd
    - human-time-to-complete.qmd
    - verifiability.qmd
    - augmentation-productivity-effects.qmd
    - augmentation-and-worker-skill.qmd
    - augmentation-benchmarks.qmd
    - human-ai-teams.qmd
    - misperception-of-llm-abilities.qmd
    - occupational-exposure-indices.qmd
    - inference-price-decline.qmd
    - frontier-inference-cost.qmd
    - inference-vs-training-costs.qmd
    - llm-vs-human-cost.qmd
    - economic-impact-so-far.qmd
    - directing-technical-change.qmd
    - univariate-model-of-intelligence.qmd
    - wages-and-compute-price.qmd
    - offcuts.qmd
    - references.qmd

# Shared with the paper: exactly one bibliography and one image directory
# (book/images is a symlink to ../images). The tikz figures are pre-rendered
# SVGs, sources in book/tikz/, rebuilt with `make tikz`; so there is no
# executable code and no engine here.
bibliography: ../stylized-facts.bib

number-sections: false
lightbox: auto

format:
  html:
    theme: cosmo
    css: book.css   # tints the LLM-written section
    toc: false   # chapters are short; the sidebar is the table of contents
    grid:
      margin-width: 400px
    include-in-header:
      - text: |
          <script>window.MathJax = {
                   tex: { macros: {
                      bm: ["\\boldsymbol{#1}", 1],
                      ut: ["\\underbrace{#1}_{\\text{#2}}", 2],
                      utt: ["\\underbrace{#1}_{\\substack{\\text{#2}\\\\\\text{#3}}}", 3]
                   } } };
          </script>
