name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The checks read references/text/ but never references/pdf/ (~200 MB).
      #
      # Both settings are needed. sparse-checkout keeps the PDFs out of the
      # working tree but not out of .git — a plain sparse clone still weighs
      # 207 MB. filter=blob:none makes it a partial clone that fetches only
      # the blobs actually checked out, which brings it to 25 MB.
      #
      # images/ is needed too: one check verifies every figure the paper
      # references is on disk, and it fails spuriously without them.
      #
      # book/ is the question-per-chapter book; its checks run alongside the
      # paper's. book/images is a symlink to ../images.
      #
      # Cone mode also brings in files sitting directly in references/
      # (manifest.csv, arxiv-metadata.csv) and every root-level file, so the
      # .qmd and .bib arrive without being listed.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            images
            book
            references/text
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bibclean is optional: the bib tests skip the lint when it is absent.
      # Everything else here is stdlib.
      - name: Install bibclean
        run: sudo apt-get update && sudo apt-get install -y bibclean
        continue-on-error: true

      # No network and no PDFs: every check reads references/text/, which is
      # committed. references/pdf/ is git-ignored and absent here by design.
      - name: Bibliography conventions
        run: python3 "tools/stylized-facts.bib.tests.py" --check

      - name: Bibliography formatting is normalized
        run: python3 tools/bib_normalize.py --check

      - name: arXiv ids match their bib entries
        run: python3 tools/arxiv_check.py --check

      - name: Document checks
        run: python3 tools/qmd_validate.py --all

      - name: README status table is current
        run: python3 tools/status_table.py --check
